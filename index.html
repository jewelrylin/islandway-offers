<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>島途優惠資料端點</title><style>body{font-family:-apple-system,"PingFang TC",sans-serif;max-width:720px;margin:48px auto;padding:0 24px;line-height:1.8;color:#12202C}code{background:#F1EADF;padding:2px 6px;border-radius:4px}h1{color:#0E3350}</style></head><body><h1>島途 ISLANDWAY｜優惠資料端點</h1><p>這個 repo 提供「島途」App 開啟時自動抓取的優惠資料。</p><p>端點：<code>offers-latest.js</code></p><p>App 會以 script 方式載入，內容為 <code>window.OFFERS_LATEST</code> 陣列。更新這個檔案並 push，App 下次開啟就會抓到新資料。</p><p>目前筆數：25。資料為各縣市觀光局官方入口與 2026 台灣好湯活動整理；折扣與期限以官網為準。</p></body></html>
